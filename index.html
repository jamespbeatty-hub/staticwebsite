<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Budget Machine</title>
    <style>
      :root {
        --ink: #0f2d43;
        --accent: #c84b08;
        --bg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }

      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 4vh 24px 48px;
      }

      .logo-zone {
        width: 100%;
        height: 33vh;
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        display: block;
        width: min(420px, 78vw);
        max-height: 30vh;
        object-fit: contain;
      }

      .message {
        margin-top: clamp(28px, 5vh, 56px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 5.5rem);
        line-height: 1;
        font-weight: 900;
      }

      p {
        margin: clamp(26px, 5vh, 44px) 0 0;
        color: var(--accent);
        font-size: clamp(1.4rem, 3.8vw, 2.5rem);
        font-weight: 800;
        line-height: 1.1;
        text-transform: uppercase;
      }

      @media (max-height: 640px) {
        .logo-zone {
          min-height: 170px;
        }

        img {
          width: min(320px, 70vw);
        }

        .message {
          margin-top: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="The Budget Machine placeholder">
      <div class="logo-zone">
        <img
          src="ChatGPT%20Image%20May%208%2C%202026%2C%2010_53_17%20PM.png"
          alt="The Budget Machine logo"
        >
      </div>

      <div class="message">
        <h1>Take Control</h1>
        <p>Coming Soon</p>
      </div>
    </main>
  </body>
</html>
